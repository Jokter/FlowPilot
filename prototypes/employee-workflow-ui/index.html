<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>一次性原型：需求交付工作台</title>
  <style>
    :root{--bg:#f4f7fb;--ink:#172033;--muted:#68738a;--line:#dfe5ef;--blue:#2563eb;--navy:#10213f;--green:#16a36a;--amber:#d97706;--card:#fff;--shadow:0 12px 32px rgba(27,42,75,.10)}
    *{box-sizing:border-box}body{margin:0;font:14px/1.5 Inter,"Segoe UI",sans-serif;color:var(--ink);background:var(--bg)}button,input,textarea{font:inherit}.app{min-height:100vh}.top{height:60px;padding:0 24px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:20px}.brand{font-weight:800;font-size:17px;color:var(--navy)}.proto{font-size:11px;padding:3px 8px;border-radius:99px;background:#fff3cd;color:#8a5a00}.top .grow{flex:1}.user{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:#dbeafe;color:#1d4ed8;font-weight:700}.crumb{color:var(--muted)}
    .badge{display:inline-flex;align-items:center;gap:5px;padding:4px 9px;border-radius:99px;font-size:12px;background:#eef2ff;color:#3730a3}.dot{width:7px;height:7px;border-radius:50%;background:var(--green)}
    .btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:8px 13px;color:var(--ink);cursor:pointer}.btn.primary{border-color:var(--blue);background:var(--blue);color:white}.btn.ghost{background:transparent}.btn:active{transform:translateY(1px)}
    .card{background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:0 3px 12px rgba(30,45,75,.04)}.section-title{font-weight:750;margin-bottom:10px}.muted{color:var(--muted)}.tiny{font-size:12px}.ok{color:var(--green)}.warn{color:var(--amber)}
    .steps{list-style:none;padding:0;margin:0}.step{display:flex;gap:10px;padding:10px 0;color:var(--muted)}.step .num{width:24px;height:24px;flex:0 0 24px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line);font-size:12px}.step.done .num{background:#dcfce7;border-color:#86efac;color:#15803d}.step.active{color:var(--ink);font-weight:700}.step.active .num{background:var(--blue);border-color:var(--blue);color:#fff}.step small{display:block;font-weight:400;color:var(--muted)}
    .chat{display:flex;flex-direction:column;gap:12px}.msg{max-width:82%;padding:11px 13px;border-radius:12px;background:#f1f5f9}.msg.ai{align-self:flex-start;border-top-left-radius:3px}.msg.me{align-self:flex-end;background:#dbeafe;border-top-right-radius:3px}.composer{display:flex;gap:8px;margin-top:auto;padding-top:12px}.composer textarea{resize:none;flex:1;min-height:50px;border:1px solid var(--line);border-radius:9px;padding:10px;background:#fff}
    .artifact{display:flex;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid #eef1f5}.artifact:last-child{border:0}.file{width:30px;height:34px;border-radius:5px;background:#e0e7ff;display:grid;place-items:center;color:#4338ca;font-weight:700}.meter{height:7px;border-radius:9px;background:#e8edf5;overflow:hidden}.meter span{display:block;width:62%;height:100%;background:var(--blue)}
    /* A: guided workspace */
    .a-shell{display:grid;grid-template-columns:250px minmax(430px,1fr) 310px;min-height:calc(100vh - 60px)}.a-left,.a-right{padding:22px;background:#fff}.a-left{border-right:1px solid var(--line)}.a-right{border-left:1px solid var(--line)}.a-main{padding:24px}.hero{display:flex;align-items:flex-start;gap:14px;margin-bottom:18px}.hero h1{font-size:22px;margin:0 0 4px}.hero .grow{flex:1}.instruction{padding:14px 16px;margin-bottom:14px;border-left:4px solid var(--blue);background:#eff6ff;border-radius:8px}.chat-card{padding:18px;min-height:510px;display:flex;flex-direction:column}.side-block{margin-bottom:22px}.checks{padding:0;margin:0;list-style:none}.checks li{padding:7px 0}.checks li::before{content:"○";margin-right:8px;color:#9aa5b5}.checks li.pass::before{content:"✓";color:var(--green)}
    /* B: chat cockpit */
    .b-shell{height:calc(100vh - 60px);display:grid;grid-template-columns:190px 1fr 360px;background:#0b1220;color:#e8edf7}.b-nav{padding:20px 14px;border-right:1px solid #263148}.b-nav .stage{padding:10px;border-radius:8px;color:#93a0b8;margin-bottom:4px}.b-nav .stage.on{background:#1c2a44;color:white}.b-main{padding:22px;display:flex;flex-direction:column}.b-main h1{font-size:20px;margin:0}.b-main .msg.ai{background:#172238}.b-main .msg.me{background:#1d4ed8}.b-main textarea{background:#121c30;color:#fff;border-color:#34415b}.b-side{background:#111b2e;border-left:1px solid #263148;padding:20px}.terminal{font:12px/1.7 Consolas,monospace;background:#080d17;border:1px solid #263148;padding:12px;border-radius:9px;color:#a7f3d0}.b-side .card{background:#172238;border-color:#2a3853;color:#e8edf7;padding:14px;margin-bottom:12px}.b-side .muted{color:#95a1b8}.b-actions{display:flex;gap:8px;margin:12px 0 18px}
    /* C: checklist wizard */
    .c-shell{padding:26px 5vw 100px}.ribbon{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin:0 auto 24px;max-width:1180px}.rib{background:white;border:1px solid var(--line);border-radius:9px;padding:10px;text-align:center;color:var(--muted)}.rib.done{background:#ecfdf5;border-color:#a7f3d0;color:#047857}.rib.on{background:var(--navy);border-color:var(--navy);color:white}.c-head{max-width:900px;margin:0 auto 18px;text-align:center}.c-head h1{font-size:26px;margin:4px}.wizard{max-width:900px;margin:auto;padding:24px}.task-row{display:grid;grid-template-columns:34px 1fr auto;gap:12px;align-items:start;padding:15px 0;border-bottom:1px solid var(--line)}.task-row:last-child{border:0}.check{width:26px;height:26px;border-radius:7px;border:2px solid #cbd5e1;display:grid;place-items:center}.task-row.done .check{background:var(--green);border-color:var(--green);color:white}.task-row.active{margin:0 -12px;padding:16px 12px;background:#eff6ff;border-radius:10px;border:0}.task-row.active .check{border-color:var(--blue);color:var(--blue)}.c-chat{margin-top:20px;padding:16px;background:#f8fafc;border-radius:10px}.next{display:flex;justify-content:flex-end;margin-top:18px}
    .switcher{position:fixed;z-index:20;left:50%;bottom:18px;transform:translateX(-50%);display:flex;align-items:center;gap:7px;padding:7px;background:#111827;color:white;border-radius:999px;box-shadow:var(--shadow)}.switcher button{border:0;background:#303a4c;color:white;width:34px;height:34px;border-radius:50%;cursor:pointer}.switcher .label{min-width:210px;text-align:center;font-weight:700}.hint{position:fixed;right:16px;bottom:21px;font-size:12px;color:var(--muted)}
    @media(max-width:1000px){.a-shell{grid-template-columns:210px 1fr}.a-right{display:none}.b-shell{grid-template-columns:150px 1fr}.b-side{display:none}.ribbon{grid-template-columns:repeat(3,1fr)}}
  </style>
</head>
<body>
<div class="app">
  <header class="top"><span class="brand">FlowPilot</span><span class="proto">一次性设计原型</span><span class="crumb">需求 / WF-018 / 员工门户增加导出功能</span><span class="grow"></span><span class="badge"><i class="dot"></i> Codex 已连接</span><span class="user">林</span></header>
  <main id="root"></main>
</div>
<div class="switcher"><button id="prev">←</button><div class="label" id="variantLabel"></div><button id="next">→</button></div><div class="hint">键盘 ← → 切换方案</div>
<script>
const steps=`<ol class="steps">
  <li class="step done"><span class="num">✓</span><span>需求提交<small>已完成 · 林晓</small></span></li>
  <li class="step done"><span class="num">✓</span><span>需求分析<small>已确认 · 11:20</small></span></li>
  <li class="step done"><span class="num">✓</span><span>SDD 设计<small>v2 已通过</small></span></li>
  <li class="step active"><span class="num">4</span><span>开发与测试<small>Codex 正在协作</small></span></li>
  <li class="step"><span class="num">5</span><span>独立代码评审<small>等待中</small></span></li>
  <li class="step"><span class="num">6</span><span>创建 Draft PR<small>等待中</small></span></li>
</ol>`;
const chat=`<div class="chat">
  <div class="msg ai"><b>Codex · test-driven-development</b><br>我已根据 SDD 写出导出接口的失败测试。当前有 3 个测试按预期失败，下一步将实现最小代码使它们通过。</div>
  <div class="msg me">导出文件名还需要包含当前日期，请补到验收测试里。</div>
  <div class="msg ai"><b>Codex</b><br>已补充日期格式场景，并确认时区使用系统配置。是否继续实现？</div>
</div>`;
const composer=`<div class="composer"><textarea placeholder="继续向 Codex 补充要求……"></textarea><button class="btn primary">发送</button></div>`;
const artifacts=`<div class="artifact"><span class="file">SDD</span><span><b>技术设计 v2</b><br><small class="muted">已审批 · 12.4 KB</small></span></div><div class="artifact"><span class="file">TS</span><span><b>测试结果</b><br><small class="ok">8 通过，3 预期失败</small></span></div><div class="artifact"><span class="file">DIFF</span><span><b>代码变更</b><br><small class="muted">4 文件，+126 −18</small></span></div>`;
const variants={
A:{name:"引导式三栏工作台",html:()=>`<div class="a-shell"><aside class="a-left"><div class="section-title">交付流程 · 4/6</div>${steps}<div class="side-block" style="margin-top:25px"><div class="tiny muted">整体进度</div><div class="meter"><span></span></div></div></aside><section class="a-main"><div class="hero"><div class="grow"><span class="badge">当前步骤</span><h1>开发与测试</h1><div class="muted">系统已指定：Superpowers / TDD</div></div><button class="btn">Thread ▾</button><button class="btn">权限：工作区 ▾</button></div><div class="instruction"><b>这一步要完成什么？</b><br>让 Codex 按 SDD 实现功能并通过测试。确认 diff 与测试证据后提交本节点。</div><div class="card chat-card">${chat}${composer}</div></section><aside class="a-right"><div class="side-block"><div class="section-title">完成条件</div><ul class="checks"><li class="pass">已读取获批 SDD</li><li>自动化测试全部通过</li><li>代码变更已人工查看</li></ul></div><div class="side-block"><div class="section-title">产物与证据</div>${artifacts}</div><button class="btn primary" style="width:100%">确认本节点完成</button></aside></div>`},
B:{name:"Codex 对话驾驶舱",html:()=>`<div class="b-shell"><aside class="b-nav"><div class="tiny muted" style="padding:8px">WF-018 · 4/6</div><div class="stage">✓ 需求提交</div><div class="stage">✓ 需求分析</div><div class="stage">✓ SDD 设计</div><div class="stage on">● 开发与测试</div><div class="stage">○ 独立评审</div><div class="stage">○ Draft PR</div></aside><section class="b-main"><div><span class="badge">TDD Skill</span><h1>Codex 开发会话</h1><span class="muted">Thread thr_9c82 · workspace · high</span></div><div class="b-actions"><button class="btn ghost">压缩上下文</button><button class="btn ghost">分叉 Thread</button><button class="btn ghost">查看 Diff</button></div>${chat}${composer}</section><aside class="b-side"><div class="section-title">实时运行</div><div class="terminal">$ ./mvnw test<br><span>Tests run: 11</span><br><span>Failures: 3 (expected)</span><br><span>BUILD SUCCESS</span></div><div class="section-title" style="margin-top:18px">产物</div><div class="card">${artifacts}</div><div class="card"><b>流程门禁</b><br><span class="muted">测试尚未全部通过，暂不可提交。</span></div><button class="btn primary" style="width:100%">提交开发结果</button></aside></div>`},
C:{name:"新员工清单向导",html:()=>`<div class="c-shell"><div class="ribbon"><div class="rib done">1 需求</div><div class="rib done">2 分析</div><div class="rib done">3 SDD</div><div class="rib on">4 开发</div><div class="rib">5 评审</div><div class="rib">6 交付</div></div><div class="c-head"><span class="badge">第 4 步，共 6 步</span><h1>按照清单完成开发与测试</h1><p class="muted">无需了解团队流程，依次完成下面三项即可。</p></div><div class="card wizard"><div class="task-row done"><span class="check">✓</span><span><b>1. 让 Codex 理解设计</b><br><small class="muted">系统已加载获批 SDD 和 TDD Skill。</small></span><button class="btn">查看</button></div><div class="task-row active"><span class="check">2</span><span><b>2. 与 Codex 完成功能</b><br><small class="muted">当前：正在补充日期文件名的验收测试。</small><div class="c-chat">${chat}${composer}</div></span><span class="badge"><i class="dot"></i>进行中</span></div><div class="task-row"><span class="check">3</span><span><b>3. 检查结果并提交</b><br><small class="muted">测试通过后，系统会引导你检查 diff。</small></span><button class="btn" disabled>未解锁</button></div><div class="next"><button class="btn primary" disabled>进入代码评审 →</button></div></div></div>`}
};
const keys=Object.keys(variants);let key=new URLSearchParams(location.search).get('variant')?.toUpperCase();if(!variants[key])key='A';
function render(nextKey){key=nextKey;history.replaceState(null,'',`?variant=${key}`);document.getElementById('root').innerHTML=variants[key].html();document.getElementById('variantLabel').textContent=`${key} — ${variants[key].name}`}
function cycle(n){render(keys[(keys.indexOf(key)+n+keys.length)%keys.length])}
document.getElementById('prev').onclick=()=>cycle(-1);document.getElementById('next').onclick=()=>cycle(1);addEventListener('keydown',e=>{if(['INPUT','TEXTAREA'].includes(document.activeElement.tagName)||document.activeElement.isContentEditable)return;if(e.key==='ArrowLeft')cycle(-1);if(e.key==='ArrowRight')cycle(1)});render(key);
</script>
</body>
</html>
